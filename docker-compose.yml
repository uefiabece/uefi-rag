# Postgres de verdade com pgvector, para quem prefere não usar o PGlite embutido.
#   docker compose up -d
#   DATABASE_URL=postgres://rag:rag@localhost:5432/rag npm run ingest
# O schema é o mesmo (server/src/db.ts); unaccent já vem na imagem.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
