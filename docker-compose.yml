# Postgres de verdade com pgvector, para quem prefere não usar o PGlite embutido.
#   docker compose up -d
#   DATABASE_URL=postgres://rag:rag@localhost:5432/rag npm run ingest
# O schema é o mesmo (server/src/db.ts); unaccent já vem na imagem.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag"]
      interval: 5s
      retries: 10

  # Visualizador de traces, fora do `up` padrão: docker compose --profile traces up -d jaeger
  jaeger:
    image: jaegertracing/jaeger:latest
    profiles: [traces]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

volumes:
  pgdata:
